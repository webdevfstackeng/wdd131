<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital@0;1&display=swap"
      rel="stylesheet"/>
    <title>Gallery Pictures Lazy Loading</title>
    <meta
      name="description"
      content="This WDD 131 - Dynamic Web Fundamentals web page features a form design in Frontend Web Development using HTML, CSS and Javascript">
    <meta name="author" content="Kgotla Ephraim Boabilwe">
    <link rel="stylesheet" href="styles/contact-us.css">
  
</head>
<body>
  <header>
    <h1> Lazy Loading</h1>
  </header>
  <main> 
    <section id="gallery">
      <h2>Events Photo Gallery</h2>
      <div class="gallery">
        <picture>
          <img src="images/gallery1.webp" alt="Buffet Setup" loading="lazy" width="400" height="600"></picture>
        <picture>
          <img src="images/gallery2.webp" alt="Feasting table setup" loading="lazy" width="400" height="600"></picture> 
        <picture><img src="images/gallery3.webp" alt="Self-serving Buffet" loading="lazy" width="400" height="600"></picture>
        <picture><img src="images/gallery6.webp" alt="Self-Serving Dinner" loading="lazy" width="400" height="600"></picture>
        <picture><img src="images/selfservice.webp" alt="Corporate Dinner Chefs Setting up" loading="lazy" width="400" height="600"></picture>
        <picture><img src="images/buffet.webp" alt="Chefs Setting Buffet Luncheon" loading="lazy" width="400" height="600"></picture>
      </div>
    </section>
  </main>
  <footer>

  </footer>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital@0;1&display=swap"
      rel="stylesheet">
    <meta
      name="description"
      content="Website Project for WDD 131 - Dynamic Web Development end of course individual project"
    />
    <meta name="author" content="Kgotla Ephraim Boabilwe">
    <link rel="stylesheet" href="styles/meal-order-form.css">
    <title>Meal Order Form</title>
  </head>
  <body>
    <main>
      <section id="orders">
        <h2>Record Meal Orders</h2>

        <form id="orderForm">
          <label>
            Event Type:
            <select id="eventType" required>
              <option value="">Select event</option>
              <option value="wedding">Wedding</option>
              <option value="party">Party</option>
              <option value="corporate">Corporate</option>
            </select>
          </label>

          <label>
            Dish Name:
            <input type="text" id="dishName" required />
          </label>

          <label>
            Number of Orders:
            <input type="number" id="orders" required min="1" />
          </label>

          <button type="submit">Add Order</button>
        </form>
      </section>
      <section id="results-demo">
        <h2>Events Performance Analysis</h2>

        <div id="eventTools"></div>
         <div id="topDishes"></div>
      </section>
    </main>
  </body>
</html>
